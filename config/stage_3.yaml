defaults:
  - base
  - _self_

module: cxrmate_ed.lightning_module
definition: SCSTSectionsWeightedCXRBERTBERTScoreARNReward

devices: 1
mbatch_size: 4
accumulated_mbatch_size: null

max_epochs: 5

precision: 32
float32_matmul_precision: highest

warm_start_other_exp_trial_dir: ${exp_dir}/cxrmate_ed/stage_2/trial_0

warm_start_optimiser: false
warm_start_ckpt_path_strict: false
allow_warm_start_optimiser_partial: false

lr: 5e-6
num_warmup_steps: 5000
learning_rate_monitor: True
enable_progress_bar: True
monitor: val_findings_bertscore_f1

weights: [0.45, 0.45, 0.1]
reward_section_weights: [0.75, 0.25]
reward_no_repeat_ngram_size: 3

tables_filter: ['mimic_cxr_sectioned', 'triage', 'medrecon']
prompt_report_sections_filter: ['indication', 'history']
add_time_deltas: True
history: 0

# B4: image-conditioned patient compression.
patient_data_compressor: image_conditioned_query
patient_data_compressor_num_tokens: 16
patient_data_compressor_num_heads: 8
patient_data_compressor_dropout: 0.0
patient_data_compressor_token_type: indication

# B4: gated cross-attention fusion while retaining Z in the decoder prompt.
patient_data_fusion: gated_cross_attention
patient_data_fusion_num_heads: 8
patient_data_fusion_dropout: 0.0
patient_data_fusion_prompt_mode: retain_context
